name: macOS build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test engine
        run: swift test

      - name: Build DMG
        run: ./Packaging/build_dmg.sh "0.1.${{ github.run_number }}"

      - name: Check app bundle
        run: |
          lipo -info build/LifeGPT.app/Contents/MacOS/LifeGPT
          codesign --verify --verbose build/LifeGPT.app
          hdiutil verify build/LifeGPT.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: LifeGPT-dmg
          path: build/LifeGPT.dmg
          if-no-files-found: error
